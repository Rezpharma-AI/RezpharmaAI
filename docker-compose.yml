services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - cdss-net

  api:
    build: .
    container_name: rezpharma-api
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database  
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - cdss-net
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: rezpharma-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - cdss-net
    command: streamlit run app_v2.py --server.port 8501 --server.address 0.0.0.0

networks:
  cdss-net:
    driver: bridge